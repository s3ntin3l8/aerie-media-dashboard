name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@feat/ci-node-next-cache-release-tag
    with:
      node-version: '24'
      typecheck-script: 'typecheck'
      test-script: 'test:coverage'
      # Absolute floor (runway uses 85); current line coverage is ~90%. Codecov still gates the
      # per-PR delta.
      coverage-fail-under: '85'
      # One jsdom environment per worker instead of one per test file: the suite runs ~2x faster
      # (48s -> 25s locally, same 1490 passing tests and coverage).
      test-pool: 'vmThreads'
      build-env: 'NEXT_TELEMETRY_DISABLED=1'
      strict-checks: true
    secrets: inherit  # pragma: allowlist secret

  docker:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: s3ntin3l8/.github/.github/workflows/docker-publish.yml@main
    with:
      image-name: 's3ntin3l8/aerie'
      push-edge: true
    secrets: inherit  # pragma: allowlist secret
