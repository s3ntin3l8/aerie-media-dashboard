version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      types:
        patterns:
          - "@types/*"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-images:
        patterns:
          - "*"

  # The visual-kit image `make screenshots` / `make visual-check` render in (visual/Dockerfile). A bump moves the
  # browser and fonts, so it recaptures the check's base and can make the committed baselines stale: regenerate
  # them (`make visual-baseline`, or `/update-baselines` on the PR) in the same change if the shots move.
  - package-ecosystem: "docker"
    directory: "/visual"
    schedule:
      interval: "weekly"
      day: "monday"
